# TODO: awaiting AK confirmation of mandatory business information and scope.
# image_reference, signature and attestation are examples, not confirmed rules.
# This setting is separate from the five required row-validation fields in
# PROJECT_SPEC.md, "8. Technical validation and duplicate semantics".
required_fields: null

# Nominal positions 20, 40, ...; duplicate/missing/multiple suppliers are skipped
# forward (priority 2, 2026-09-30). Target floor(population / interval), no duplicates.
manual_sample_interval: 20

# Presentation only: no generic internal/external signal exists. No examples are
# activated. Each future entry requires explicit confirmation and a reason.
# Fields: id, match_field (organization_number or supplier_name), value (string),
# classification (INTERNAL / NOT_RELEVANT / EXTERNAL), reason, confirmed (boolean).
# Names use exact existing Huvudtext extraction + normalization; organization
# numbers require STRONG_MATCH. Unmatched/conflicting rules do not hide rows.
# These rules never affect sampling, matching accuracy, base filters or exports.
supplier_view_rules: []

